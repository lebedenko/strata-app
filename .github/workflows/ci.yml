name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake ninja git qt6-base qt6-declarative qt6-svg tomlplusplus go-task clang llvm clazy cppcheck gitleaks arch-audit actionlint ccache python python-pip
          ln -sf /usr/bin/go-task /usr/local/bin/task
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Install CMake tools
        run: |
          python -m venv .tooling-venv
          .tooling-venv/bin/pip install -r tooling/requirements.txt
          pacman -Q > installed-packages.txt
      - name: Level 2 checks
        run: task check-lvl2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            reports/
            installed-packages.txt
          retention-days: 14
