version: '3'

tasks:
  default:
    cmds:
      - task: build

  configure:
    desc: Configure CMake build directory with Ninja
    cmds:
      - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    status:
      - test -f build/build.ninja

  build:
    desc: Build all targets with Ninja
    deps: [configure]
    cmds:
      - ninja -C build

  debug:
    desc: Build in Debug mode with Address and Undefined sanitizers
    cmds:
      - cmake -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - ninja -C build-debug

  test:
    desc: Run unit test suite
    deps: [build]
    cmds:
      - ctest --test-dir build --output-on-failure

  format:
    desc: Format C++ source files with clang-format
    cmds:
      - find src tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format -i

  format-check:
    desc: Check C++ code formatting without modifying files
    cmds:
      - find src tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror

  lint:
    desc: Run clang-tidy on source files
    deps: [configure]
    cmds:
      - python3 tooling/checks.py clang-tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build build-debug

  install:
    desc: Install strata binary to ~/.local/bin and desktop file
    deps: [build]
    cmds:
      - mkdir -p ~/.local/bin ~/.local/share/applications ~/.local/share/icons/hicolor/scalable/apps
      - install -m 755 build/strata ~/.local/bin/
      - cp desktop/io.github.lebedenko.Strata.desktop ~/.local/share/applications/
      - cp desktop/strata.svg ~/.local/share/icons/hicolor/scalable/apps/
      - update-desktop-database ~/.local/share/applications/ || true
      - echo "Installed strata to ~/.local/bin/strata"

  run:
    desc: Run strata application
    deps: [build]
    cmds:
      - ./build/strata

  run-minimized:
    desc: Run strata in background minimized to tray
    deps: [build]
    cmds:
      - ./build/strata --minimized

  check-lvl1:
    desc: Run cumulative level 1 checks and save reports
    cmds:
      - python3 tooling/checks.py lvl1

  check-lvl2:
    desc: Run cumulative level 2 checks and save reports
    cmds:
      - python3 tooling/checks.py lvl2

  check-lvl3:
    desc: Run cumulative level 3 checks and save reports
    cmds:
      - python3 tooling/checks.py lvl3

  check:clang-format:
    cmds:
      - python3 tooling/checks.py clang-format

  check:qmlformat:
    cmds:
      - python3 tooling/checks.py qmlformat

  check:cmake-format:
    cmds:
      - python3 tooling/checks.py cmake-format

  check:cmake-lint:
    cmds:
      - python3 tooling/checks.py cmake-lint

  check:actionlint:
    cmds:
      - python3 tooling/checks.py actionlint

  check:secrets-tree:
    cmds:
      - python3 tooling/checks.py secrets-tree

  check:build:
    cmds:
      - python3 tooling/checks.py build

  check:qmllint:
    cmds:
      - python3 tooling/checks.py qmllint

  check:tests:
    cmds:
      - python3 tooling/checks.py tests

  check:clang-tidy:
    cmds:
      - python3 tooling/checks.py clang-tidy

  check:clazy:
    cmds:
      - python3 tooling/checks.py clazy

  check:cppcheck:
    cmds:
      - python3 tooling/checks.py cppcheck

  check:asan-ubsan:
    cmds:
      - python3 tooling/checks.py asan-ubsan

  check:dependencies:
    cmds:
      - python3 tooling/checks.py dependencies

  check:secrets-history:
    cmds:
      - python3 tooling/checks.py secrets-history

  check:codeql:
    cmds:
      - python3 tooling/checks.py codeql

  check:valgrind:
    cmds:
      - python3 tooling/checks.py valgrind

  check:coverage:
    cmds:
      - python3 tooling/checks.py coverage

  check:fuzz:
    cmds:
      - python3 tooling/checks.py fuzz
